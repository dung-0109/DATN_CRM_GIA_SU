    <text x="50" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">(Tutor)</text>
  </g>

  <!-- ACTOR 3: ADMIN -->
  <g id="actor-admin" transform="translate(1200, 420)">
