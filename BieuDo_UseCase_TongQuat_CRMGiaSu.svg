<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 960" width="1350" height="960" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect x="200" y="25" width="940" height="910" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="200" y="25" width="940" height="42" rx="12" fill="#334155"/>
  <rect x="200" y="55" width="940" height="12" fill="#334155"/>
  <text x="670" y="52" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="0.5">HỆ THỐNG QUẢN LÝ VÀ KẾT NỐI GIA SƯ (TUTORING CRM SYSTEM)</text>

  <!-- ACTOR 1: PHU HUYNH (PARENT) -->
  <g id="actor-parent" transform="translate(30, 200)">
    <!-- Stickman Head -->
    <circle cx="50" cy="25" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="50" y1="41" x2="50" y2="80" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="25" y1="58" x2="75" y2="58" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Legs -->
    <line x1="50" y1="80" x2="30" y2="120" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="50" y1="80" x2="70" y2="120" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Label -->
    <text x="50" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Phụ huynh</text>
    <text x="50" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">(Parent)</text>
  </g>

  <!-- ACTOR 2: GIA SU (TUTOR) -->
  <g id="actor-tutor" transform="translate(30, 620)">
    <circle cx="50" cy="25" r="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="80" stroke="#16a34a" stroke-width="2.5"/>
